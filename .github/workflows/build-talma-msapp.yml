name: Build TALMA Power Apps

on:
  push:
    branches:
      - talma-powerapps-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SourceCode baseline and TALMA source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/gabrielndluna/power-apps-ai-skills.git /tmp/powerapps-base
          cp -a /tmp/powerapps-base/Dayaway_YNSE/_pack_check "$RUNNER_TEMP/talma-src"
          rm -rf "$RUNNER_TEMP/talma-src/Src"
          base64 -d "$GITHUB_WORKSPACE/talma_payload.b64" > "$RUNNER_TEMP/talma_payload.zip"
          unzip -q "$RUNNER_TEMP/talma_payload.zip" -d "$RUNNER_TEMP/talma-src"
          test -s "$RUNNER_TEMP/talma-src/app.msapr"
          test -s "$RUNNER_TEMP/talma-src/Src/App.pa.yaml"
          test -s "$RUNNER_TEMP/talma-src/Src/Approvals.pa.yaml"
          find "$RUNNER_TEMP/talma-src/Src" -maxdepth 1 -type f -print

      - name: Install Power Platform CLI
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          "$HOME/.dotnet/tools/pac" help >/dev/null

      - name: Pack real msapp
        shell: bash
        run: |
          set -euo pipefail
          PAC="$HOME/.dotnet/tools/pac"
          "$PAC" canvas pack --sources "$RUNNER_TEMP/talma-src" --msapp "$GITHUB_WORKSPACE/TALMA_Registro_Equipajes.msapp" --layout SourceCode --overwrite
          test -s "$GITHUB_WORKSPACE/TALMA_Registro_Equipajes.msapp"
          unzip -t "$GITHUB_WORKSPACE/TALMA_Registro_Equipajes.msapp"
          unzip -l "$GITHUB_WORKSPACE/TALMA_Registro_Equipajes.msapp" | tee msapp-files.txt
          unzip -p "$GITHUB_WORKSPACE/TALMA_Registro_Equipajes.msapp" 'Src/App.pa.yaml' | grep -F 'StartScreen: =Approvals'

      - name: Upload compiled app
        uses: actions/upload-artifact@v4
        with:
          name: TALMA_Registro_Equipajes
          path: |
            TALMA_Registro_Equipajes.msapp
            msapp-files.txt
          if-no-files-found: error
